version: 2
gates:
  - id: GOV-001
    name: governance
    condition: policies_and_schemas_valid
    evidence: validation_report
    on_failure: block
  - id: GODOT-001
    name: godot-foundation
    condition: project_files_and_scene_present
    evidence: headless_or_static_report
    on_failure: block
  - id: TEST-001
    name: tests
    condition: applicable_tests_pass
    evidence: test_report
    on_failure: block
  - id: REVIEW-001
    name: engineering-review
    condition: no_p0_p1
    evidence: review_report
    on_failure: block
  - id: HUMAN-001
    name: human-approval
    condition: required_approval_recorded
    evidence: approval_record
    on_failure: await_approval
  - id: DB-001
    name: mysql-schema-documentation
    condition: applicable_mysql_objects_documented_100_percent_and_migrations_valid
    evidence: schema_coverage_and_migration_report
    on_failure: block
  - id: DB-002
    name: mysql-integrity-performance
    condition: applicable_concurrency_and_critical_query_benchmarks_pass
    evidence: mysql_integrity_and_benchmark_report
    on_failure: block
  - id: SEC-001
    name: security-and-iap
    condition: applicable_auth_privacy_and_iap_controls_verified
    evidence: security_and_billing_test_report
    on_failure: block
  - id: LIVEOPS-001
    name: campaign-and-reward-integrity
    condition: applicable_consent_route_queue_and_reward_idempotency_verified
    evidence: liveops_test_report
    on_failure: block
